name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify release documentation
        run: |
          ./gradlew --no-daemon updateReleaseDocsVersion \
            -PreleaseVersion="${GITHUB_REF_NAME}" \
            --no-configuration-cache
          git diff --exit-code -- README.md docs

      - name: Test Go CLI
        working-directory: titan-cli
        run: go test ./...

      - name: Build
        run: ./gradlew --no-daemon -PversionName="${GITHUB_REF_NAME}" clean build --stacktrace

      - name: Build Go CLI
        shell: bash
        working-directory: titan-cli
        run: |
          set -euo pipefail

          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="titan-cli-${GITHUB_REF_NAME}-${os}-${arch}"

            GOOS="${os}" GOARCH="${arch}" go build \
              -ldflags "-X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${name}/titan" \
              .

            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" titan
          done

          os="windows"
          arch="amd64"
          name="titan-cli-${GITHUB_REF_NAME}-${os}-${arch}"

          GOOS="${os}" GOARCH="${arch}" go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}/titan.exe" \
            .

          (cd "dist/${name}" && zip -q "../${name}.zip" titan.exe)

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          server_jar="bootstrap/build/libs/titan-server-${GITHUB_REF_NAME}.jar"

          test -f "${server_jar}"
          cp "${server_jar}" release-assets/
          cp titan-cli/dist/titan-cli-"${GITHUB_REF_NAME}"-*.tar.gz release-assets/
          cp titan-cli/dist/titan-cli-"${GITHUB_REF_NAME}"-*.zip release-assets/

          ls -la release-assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: container_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Generate CLI container metadata
        id: cli_container_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.container_meta.outputs.tags }}
          labels: ${{ steps.container_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish CLI container image
        uses: docker/build-push-action@v7
        with:
          context: ./titan-cli
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.cli_container_meta.outputs.tags }}
          labels: ${{ steps.cli_container_meta.outputs.labels }}
          cache-from: type=gha,scope=titan-cli
          cache-to: type=gha,mode=max,scope=titan-cli

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon -PversionName="${GITHUB_REF_NAME}" publishAndReleaseToMavenCentral
