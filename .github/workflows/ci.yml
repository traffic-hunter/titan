name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: ./gradlew --no-daemon build --stacktrace

      - name: Test Go CLI
        working-directory: titan-cli
        run: go test ./...

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/

  container:
    name: Build and run container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: VERSION=ci
          tags: titan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CLI container image
        uses: docker/build-push-action@v7
        with:
          context: ./titan-cli
          load: true
          push: false
          build-args: VERSION=ci
          tags: titan-cli:ci
          cache-from: type=gha,scope=titan-cli
          cache-to: type=gha,mode=max,scope=titan-cli

      - name: Verify container startup
        shell: bash
        run: |
          set -euo pipefail

          docker network create titan-ci

          docker run --detach --name titan-ci --network titan-ci \
            --publish 61613:61613 \
            --publish 7777:7777 \
            --volume "${PWD}/docker/titan-env.yml:/etc/titan/titan-env.yml:ro" \
            titan:ci

          trap 'docker logs titan-ci; docker rm --force titan-ci; docker network rm titan-ci' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7777/titan/monitor/health; then
              docker run --rm --network titan-ci titan-cli:ci \
                --addr http://titan-ci:7777 --once --no-clear --no-color
              exit 0
            fi
            sleep 1
          done

          exit 1
