services:
  titan:
    image: titan:local
    build:
      context: .
      args:
        VERSION: local
    ports:
      - "61613:61613"
      - "127.0.0.1:7777:7777"
    volumes:
      - ./docker/titan-env.yml:/etc/titan/titan-env.yml:ro
    stop_grace_period: 30s
    restart: unless-stopped

  titan-cli:
    image: titan-cli:local
    build:
      context: ./titan-cli
      args:
        VERSION: local
    profiles:
      - tools
    depends_on:
      titan:
        condition: service_healthy
    command:
      - --addr
      - http://titan:7777
    stdin_open: true
    tty: true
